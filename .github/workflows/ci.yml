# CI: lint, test, coverage, build (quality only)
# - PR to main: full checks + Codecov upload
# - workflow_dispatch: same + Codecov upload (on-demand coverage report)
# - Push / merge to main: no workflow (already validated on the PR)
# Security (gitleaks, govulncheck, CodeQL): see .github/workflows/security.yml
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  library:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # v2 is built with Go >= 1.26; v1.x binaries refuse modules targeting go 1.26+
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest

      - name: Install Task
        run: go install github.com/go-task/task/v3/cmd/task@latest

      - name: Lint
        run: task lint

      - name: Test
        run: task test

      - name: Code coverage
        run: task test-coverage

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: agenticenv/durable-go
          files: ./coverage.out

      - name: Build
        run: task build
