# GoReleaser — library-only: changelog + GitHub Release, no binaries.
# See https://goreleaser.com/customization/

version: 2

project_name: durable-go

builds:
  - skip: true

checksum:
  disable: true

release:
  header: |
    ## durable-go

    Lightweight, embeddable durable task execution for Go — no external infra required.

    ### Install

    ```bash
    go get github.com/agenticenv/durable-go@{{ .Tag }}
    ```

    Docs: https://pkg.go.dev/github.com/agenticenv/durable-go@{{ .Tag }}
  footer: |
    **Full Changelog**: https://github.com/agenticenv/durable-go/compare/{{ if .PreviousTag }}{{ .PreviousTag }}...{{ end }}{{ .Tag }}

changelog:
  use: github
  sort: asc
  groups:
    - title: "Features"
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: "Bug Fixes"
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: "Documentation"
      regexp: '^.*?docs?(\([[:word:]]+\))??!?:.+$'
      order: 2
    - title: "Tests"
      regexp: '^.*?test(\([[:word:]]+\))??!?:.+$'
      order: 3
    - title: "CI/CD"
      regexp: '^.*?ci(\([[:word:]]+\))??!?:.+$'
      order: 4
    - title: "Maintenance"
      regexp: '^.*?chore(\([[:word:]]+\))??!?:.+$'
      order: 5
    - title: "Other"
      order: 999
